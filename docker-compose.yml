services:
  db:
    image: postgres:16-alpine
    container_name: famchop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: famchop
      POSTGRES_PASSWORD: famchop
      POSTGRES_DB: famchop
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres on 5432
      - "5433:5432"
    volumes:
      - famchop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famchop -d famchop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  famchop_pgdata:
